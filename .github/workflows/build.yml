name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # release 包默认用工程内 .keystore/starwol.jks 签名。
      # 仓库里不提交它的话，这里现场生成一个（密码都是 starwol）。
      # 想要固定签名就配 KEYSTORE_BASE64 secret，把它解码成 .keystore/starwol.jks。
      - name: Prepare signing key
        run: |
          mkdir -p .keystore
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > .keystore/starwol.jks
          else
            keytool -genkeypair -v \
              -keystore .keystore/starwol.jks \
              -alias starwol -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass starwol -keypass starwol \
              -dname "CN=StarWOL, OU=Dev, O=StarWOL, L=SH, ST=SH, C=CN"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: StarWOL-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: StarWOL-release
          path: app/build/outputs/apk/release/*.apk
