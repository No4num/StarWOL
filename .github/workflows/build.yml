name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub 的 ubuntu runner 自带 Android SDK，直接用。
      # 之前用 android-actions/setup-android@v3，在第 1 次 run 里 7 秒就挂了，
      # 换成显式检查 + AGP 自动补齐缺失组件。
      - name: Setup Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then SDK="/usr/local/lib/android/sdk"; fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDK dir: $SDK"
          echo "--- platforms ---"; ls "$SDK/platforms" 2>/dev/null || echo "(none)"
          echo "--- build-tools ---"; ls "$SDK/build-tools" 2>/dev/null || echo "(none)"
          echo "--- licenses ---"; ls "$SDK/licenses" 2>/dev/null || echo "(none)"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 签名材料不进仓库。
      # 配了 KEYSTORE_BASE64 secret：用它解码出 .keystore/starwol.jks，签名固定，可以覆盖升级。
      # 没配：现场生成一个一次性密钥，每次构建签名都不同，只适合测试安装。
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p .keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > .keystore/starwol.jks
            echo "KEYSTORE_PASSWORD=$KS_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KS_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KS_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            PW=$(openssl rand -hex 16)
            keytool -genkeypair -v \
              -keystore .keystore/starwol.jks \
              -alias starwol -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PW" -keypass "$PW" \
              -dname "CN=StarWOL, OU=Dev, O=StarWOL, L=SH, ST=SH, C=CN"
            echo "KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$PW" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=starwol" >> "$GITHUB_ENV"
          fi
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/.keystore/starwol.jks" >> "$GITHUB_ENV"
          echo "signing key ready, from secret: ${KEYSTORE_BASE64:+yes}"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: StarWOL-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: StarWOL-release
          path: app/build/outputs/apk/release/*.apk
